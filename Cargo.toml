[workspace]
resolver = "3"
members = ["crates/rlogg-core", "crates/rlogg-app"]

[workspace.package]
version = "0.1.0"
edition = "2024"
license = "GPL-3.0-or-later"
rust-version = "1.99"
publish = false

[workspace.dependencies]
rlogg-core = { path = "crates/rlogg-core" }

# GPUI is pre-1.0 and breaks on minor bumps: pin EXACTLY and bump gpui-pre,
# gpui-pre-platform, gpui-component and gpui-kit-assets together (gpui-component pins gpui-pre).
gpui = { package = "gpui-pre", version = "=0.3.9" }
gpui_platform = { package = "gpui-pre-platform", version = "=0.3.9", features = ["font-kit", "x11", "wayland"] }
gpui-component = { version = "=0.8.0" }
# gpui-component's icons (check marks, chevrons); same release as gpui-component.
gpui-kit-assets = { version = "=0.8.0" }

memmap2 = "0.9"
thiserror = "2"
rayon = "1.12"
memchr = "2.7"
regex = "1.13"
roaring = "0.12"
encoding_rs = "0.8"
chardetng = "1"
serde = { version = "1", features = ["derive"] }
toml = "0.9"
directories = "6"
criterion = { version = "0.8", default-features = false, features = ["cargo_bench_support"] }
async-channel = "2.5"
anyhow = "1"
tracing = "0.1"
notify = "8.2"
unicode-width = "0.2"
base64 = "0.23"
serde_json = { version = "1", features = ["preserve_order"] }
crc32fast = "1.5"
percent-encoding = "2.3"
quick-xml = "0.41"
tracing-subscriber = { version = "0.3", features = ["env-filter"] }

# GPUI does layout and text shaping on the CPU every frame; an unoptimized
# dependency graph drops frames even in debug builds.
[profile.dev.package."*"]
opt-level = 3

# The engine's hot loops (line scan, index compression) are ~8x slower at
# opt-level 0, which makes debug builds unusable on multi-GB files.
[profile.dev.package.rlogg-core]
opt-level = 3

[profile.release]
lto = "thin"
codegen-units = 1
