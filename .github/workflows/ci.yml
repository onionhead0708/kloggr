name: CI

on:
  push:
    branches: ["**"]
  pull_request:

env:
  CARGO_TERM_COLOR: always

jobs:
  linux:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v7
      - name: System packages
        # The runner image sends apt to azure.archive.ubuntu.com through a
        # mirror list; that name stopped resolving on 2026-11-11, so use the
        # main archive directly.
        run: |
          getent hosts azure.archive.ubuntu.com archive.ubuntu.com || true
          for f in $(sudo grep -lrs 'mirror+file:' /etc/apt/sources.list /etc/apt/sources.list.d); do
            sudo sed -i 's#mirror+file:/etc/apt/apt-mirrors.txt#http://archive.ubuntu.com/ubuntu/#' "$f"
          done
          sudo apt-get -o Acquire::Retries=3 update
          sudo apt-get -o Acquire::Retries=3 install -y build-essential pkg-config cmake libfontconfig-dev \
            libxkbcommon-dev libxkbcommon-x11-dev libwayland-dev libdbus-1-dev libvulkan-dev
      - name: Rust (version from rust-toolchain.toml)
        run: rustup show active-toolchain || rustup toolchain install
      - uses: Swatinem/rust-cache@v2
      - uses: taiki-e/install-action@v2
        with:
          tool: cargo-nextest,cargo-deny
      - run: cargo fmt --check
      - run: cargo clippy --all-targets -- -D warnings
      - run: cargo nextest run --no-fail-fast
      - run: cargo deny check

  # Windows and macOS: build and test. Formatting and licences are the same
  # everywhere, so only Linux checks them.
  other:
    strategy:
      fail-fast: false
      matrix:
        os: [windows-2025, macos-15]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v7
      - name: Rust (version from rust-toolchain.toml)
        shell: bash
        run: rustup show active-toolchain || rustup toolchain install
      - uses: Swatinem/rust-cache@v2
      - uses: taiki-e/install-action@v2
        with:
          tool: cargo-nextest
      - run: cargo clippy --all-targets -- -D warnings
      - run: cargo nextest run --no-fail-fast
