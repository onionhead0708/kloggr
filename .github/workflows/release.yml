name: Release

# Push a tag like v0.1.0 to build the Linux packages and attach them to a
# GitHub release of that name.
on:
  push:
    tags: ["v*"]

permissions:
  contents: write

env:
  CARGO_TERM_COLOR: always

jobs:
  linux:
    # The oldest supported runner: the .deb and the binary then work on
    # systems with this glibc or newer.
    runs-on: ubuntu-22.04
    steps:
      - uses: actions/checkout@v4
      - name: System packages
        run: |
          sudo apt-get update
          sudo apt-get install -y build-essential pkg-config cmake libfontconfig-dev \
            libxkbcommon-dev libxkbcommon-x11-dev libwayland-dev libdbus-1-dev libvulkan-dev \
            dpkg-dev fakeroot
      - name: Rust (version from rust-toolchain.toml)
        run: rustup show active-toolchain || rustup toolchain install
      - uses: Swatinem/rust-cache@v2
      - name: appimagetool
        run: |
          curl -fsSL -o "$RUNNER_TEMP/appimagetool" \
            https://github.com/AppImage/appimagetool/releases/download/continuous/appimagetool-x86_64.AppImage
          chmod +x "$RUNNER_TEMP/appimagetool"
          echo "APPIMAGETOOL=$RUNNER_TEMP/appimagetool" >> "$GITHUB_ENV"
      - name: Version matches the tag
        run: |
          version=$(sed -n 's/^version = "\(.*\)"/\1/p' Cargo.toml | head -1)
          test "v$version" = "$GITHUB_REF_NAME" || { echo "Cargo.toml has $version, tag is $GITHUB_REF_NAME"; exit 1; }
      - name: Packages
        env:
          # Runners have no FUSE: let the AppImage tool unpack itself.
          APPIMAGE_EXTRACT_AND_RUN: 1
        run: scripts/package-linux.sh
      - name: Release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh release create "$GITHUB_REF_NAME" target/package/* \
            --title "kloggr $GITHUB_REF_NAME" --generate-notes
